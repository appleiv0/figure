services:
  mongodb:
    image: mongo:7
    container_name: abuse-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: abuse-backend
    restart: always
    ports:
      - "3301:3301"
    env_file:
      - ./backend/.env
    environment:
      - PRODUCTION=True
      - PORT=3301
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=abuse_therapy
      - CORS_ORIGINS=http://localhost:3000,http://localhost,*
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/downloads:/app/downloads
      - ./backend/therapy_result:/app/therapy_result
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_ENV_API_BACKEND_DOMAIN=/api
    container_name: abuse-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
